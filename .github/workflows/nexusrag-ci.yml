name: NexusRAG CI

on:
  push:
    branches: [main, master]
    paths:
      - 'api/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.js'
      - 'vitest.config.ts'
      - '.github/workflows/nexusrag-ci.yml'
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 与开发/验证环境一致（engines: >=22；Node24 同时规避 npm10 对
          # 可选 peer 依赖的过严 lockfile 校验，详见 docs/OPTIMIZATION_REPORT.md）
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: ESLint
        run: npx eslint .

      - name: Vitest
        run: npx vitest run

      - name: Build
        run: npm run build

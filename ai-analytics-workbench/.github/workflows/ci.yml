name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        continue-on-error: true  # P1 阶段会启用严格检查
        run: ruff check app tests

      - name: Format check (black)
        continue-on-error: true  # P1 阶段会启用严格检查
        run: black --check app tests

      - name: Type check (mypy)
        continue-on-error: true  # P1 阶段渐进收紧，先以非阻塞方式暴露问题
        run: mypy app

      - name: Run Alembic migration dry-run
        env:
          DATABASE_URL: sqlite:///ci_check.db
          SECRET_KEY: ci-secret-not-for-prod
          OPENAI_API_KEY: test-key
          REDIS_HOST: localhost
          CELERY_BROKER_URL: memory://
          CELERY_RESULT_BACKEND: cache+memory://
        run: alembic upgrade head

      - name: Run pytest
        env:
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: ci-secret-not-for-prod
          OPENAI_API_KEY: test-key
          REDIS_HOST: localhost
          CELERY_BROKER_URL: memory://
          CELERY_RESULT_BACKEND: cache+memory://
          APP_ENV: test
          APP_DEBUG: 'false'
          CORS_ORIGINS: http://localhost:5173
        run: pytest

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-py${{ matrix.python-version }}
          path: backend/htmlcov/
          retention-days: 7

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run vitest
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-node${{ matrix.node-version }}
          path: frontend/coverage/
          retention-days: 7

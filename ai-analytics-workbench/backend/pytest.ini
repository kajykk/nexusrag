[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --cov=app --cov-report=term-missing --cov-report=html
markers =
    slow: 标记慢测试
    integration: 集成测试（需要外部服务）
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning

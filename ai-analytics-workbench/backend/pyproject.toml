# 项目级 Python 工具配置（P1 新增）：Ruff / Black / mypy

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "alembic/versions",  # 自动生成的迁移，避免被格式化扰动
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
# 启用的规则集：
# E  - pycodestyle errors
# W  - pycodestyle warnings
# F  - pyflakes (unused imports / undefined names)
# I  - isort (import 顺序)
# B  - flake8-bugbear (常见 bug 模式)
# UP - pyupgrade (升级到现代语法)
# SIM - flake8-simplify
# C4  - comprehensions
# N   - pep8-naming
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "N"]
ignore = [
    "E501",   # 行长由 black 控制
    "B008",   # FastAPI Depends() 在默认参数是标准用法
    "B904",   # raise from 在依赖链很深时反而降低可读性
    "SIM108", # 三元表达式与 if-else 等价，可读性优先
    "N805",   # Pydantic validator 第一参数叫 cls，不强制 self
    "N818",   # 异常名以 Error 结尾是 Java 风格，本仓库沿用中文/英文混合
    "UP007",  # Optional[X] 与 X | None 仍混用，待渐进迁移
    "UP045",  # 同上
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "N802", "N803"]  # 测试中允许稍后 import 与不严格命名

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


[tool.black]
line-length = 120
target-version = ["py311", "py312"]
extend-exclude = '''
/(
    alembic/versions
  | \.venv
  | build
  | dist
)/
'''


[tool.mypy]
python_version = "3.11"
strict_optional = true
ignore_missing_imports = true
# 渐进式收紧：先排除未注解的现有模块，P2 阶段逐步加入
exclude = [
    "tests/",
    "alembic/",
    "app/db/init_db.py",
    "app/visualization/matplotlib_charts.py",
]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["app.api.routes.*", "app.services.*"]
disallow_untyped_defs = false  # 现有路由层未注解，先宽容

[[tool.mypy.overrides]]
module = ["app.security", "app.logging_config", "app.config"]
disallow_untyped_defs = true
